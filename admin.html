<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>الإدارة | حكايات المخيم</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header><div class="navbar"><a class="logo" href="index.html">حكايات المخيم</a><a class="btn btn-outline" href="index.html">الموقع</a></div></header>
<main class="admin">
  <form id="login">
    <label>الايميل<input id="email" type="email" required autocomplete="username"></label>
    <label>كلمة السر<input id="pass" type="password" required autocomplete="current-password"></label>
    <button class="btn btn-main" type="submit">دخول</button>
    <p id="login-msg" class="msg bad"></p>
  </form>

  <div id="panel" hidden>
    <form id="post">
      <label>النوع<select id="type"><option value="story">حكاية</option><option value="video">فيديو</option><option value="photo">صورة</option></select></label>
      <label>العنوان<input id="title" required maxlength="120"></label>
      <label id="f-summary">نبذة قصيرة<textarea id="summary" rows="2" maxlength="220"></textarea></label>
      <label id="f-body">نص الحكاية<textarea id="body" rows="8"></textarea></label>
      <label id="f-image">صورة<input id="image" type="file" accept="image/*"></label>
      <div id="f-video" style="display:grid;gap:14px">
        <label>رابط يوتيوب (الأفضل للفيديوهات الطويلة)<input id="videoUrl" type="url" placeholder="https://youtu.be/..."></label>
        <label>أو ارفع فيديو قصير<input id="videoFile" type="file" accept="video/*"></label>
      </div>
      <button id="save" class="btn btn-main" type="submit">نشر</button>
      <p id="msg" class="msg"></p>
    </form>
    <h3 style="margin-bottom:8px">المنشورات</h3>
    <div id="list"></div>
    <button id="logout" class="btn btn-outline" style="margin-top:20px" type="button">تسجيل خروج</button>
  </div>
</main>
<script type="module" src="js/admin.js"></script>
</body>
</html>
