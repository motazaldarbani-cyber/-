<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>الإدارة | حكايات المخيم</title>
<link rel="icon" href="images/logo.jpg">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header><div class="navbar"><a class="logo" href="index.html"><img src="images/logo.jpg" alt=""><span>حكايات المخيم</span></a><a class="btn btn-outline btn-sm" href="index.html">الموقع</a></div></header>
<main class="admin">
  <form id="login">
    <label>كلمة السر<input id="pass" type="password" required autocomplete="current-password" autofocus></label>
    <button class="btn btn-main" type="submit">دخول</button>
    <p id="login-msg" class="msg bad"></p>
  </form>

  <div id="panel" hidden>
    <form id="post">
      <div class="types">
        <button type="button" data-t="story" class="on">حكاية</button>
        <button type="button" data-t="photo">صور</button>
        <button type="button" data-t="video">فيديو</button>
      </div>
      <label id="f-title">العنوان<input id="title" maxlength="120"></label>
      <label id="f-summary">نبذة قصيرة<textarea id="summary" rows="2" maxlength="220"></textarea></label>
      <label id="f-body">نص الحكاية<textarea id="body" rows="8"></textarea></label>
      <label id="f-image">صورة (يمكنك اختيار أكثر من وحدة)<input id="image" type="file" accept="image/*" multiple></label>
      <div id="f-video" style="display:grid;gap:16px">
        <label>رابط يوتيوب (الأفضل للفيديوهات الطويلة)<input id="videoUrl" type="url" placeholder="https://youtu.be/..."></label>
        <label>أو ارفع فيديو قصير<input id="videoFile" type="file" accept="video/*"></label>
      </div>
      <button id="save" class="btn btn-main" type="submit">نشر الآن</button>
      <p id="msg" class="msg"></p>
    </form>
    <h3 style="margin-bottom:8px">المنشور على الموقع</h3>
    <div id="list"></div>
    <button id="logout" class="btn btn-outline btn-sm" style="margin-top:20px" type="button">تسجيل خروج</button>
  </div>
</main>
<script type="module" src="js/admin.js"></script>
</body>
</html>
